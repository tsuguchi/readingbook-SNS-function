name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Run RuboCop
        run: bundle exec rubocop --parallel

  test:
    name: RSpec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: readingbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:password@localhost:5432/readingbook_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY_BASE: dummy_secret_for_ci_test_only_not_used_anywhere_else
      DEVISE_JWT_SECRET_KEY: dummy_jwt_secret_for_ci_test_only_not_used_anywhere

    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips libpq-dev

      - name: Setup database
        run: bundle exec rails db:create db:schema:load --trace

      - name: Run RSpec
        run: |
          if [ -d spec ]; then
            bundle exec rspec
          else
            echo "No spec/ directory yet — skipping. Add specs and remove this guard."
          fi
